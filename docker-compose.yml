version: '3.8'

services:
  bot:
    image: rtimonin569/rst_bot:latest
    container_name: rst_bot_container
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_API_BASE_URL=https://api.telegram.org
      - PYTHONUNBUFFERED=1
    volumes:
      - timoninbot_data:/data
    networks:
      - bot_network

volumes:
  timoninbot_data:
    external: true
    name: timoninbot_data

networks:
  bot_network:
    driver: bridge
